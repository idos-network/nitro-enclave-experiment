data_dir: /tmp/vector

# Vector supervises the processes directly instead of pm2-runtime.
# pm2's `log_type: json` wrapped raw *pipe chunks* (not lines) into one JSON
# envelope, so bursts of log lines collapsed into a single unparseable event and
# lines >64KB were split mid-line. The exec source frames on newlines at the
# pipe, so one log line is always one event.
sources:
  facesign:
    type: exec
    mode: streaming
    command: ["npm", "start"]
    working_directory: "${HOME_FACESIGN_SERVICE}"
    streaming:
      respawn_on_exit: true
      respawn_interval_secs: 5
    framing:
      method: newline_delimited
    # bytes, never json: a non-JSON line must be kept, not silently dropped
    decoding:
      codec: bytes
    maximum_buffer_size_bytes: 4194304

  uls:
    type: exec
    mode: streaming
    command: ["node", "index.js", "start"]
    working_directory: "${HOME_FACETEC_USAGE_LOGS}"
    streaming:
      # was pm2 `max_restarts: 0` - do not bring it back up on exit
      respawn_on_exit: false
    framing:
      method: newline_delimited
    decoding:
      codec: bytes
    maximum_buffer_size_bytes: 4194304

  facetec:
    type: exec
    mode: streaming
    # sleep 5 keeps the pm2 start-ordering delay this server relied on
    command: ["bash", "-c", "sleep 5 && bash run.ash"]
    working_directory: "${HOME_FACETEC_CUSTOM_SERVER}/deploy"
    streaming:
      respawn_on_exit: true
      respawn_interval_secs: 5
    framing:
      method: newline_delimited
    decoding:
      codec: bytes
    maximum_buffer_size_bytes: 4194304

  caddy:
    type: exec
    mode: streaming
    command: ["caddy", "run", "--config", "/home/deploy/Caddyfile", "--adapter", "caddyfile"]
    working_directory: /home/deploy
    streaming:
      respawn_on_exit: true
      respawn_interval_secs: 5
    framing:
      method: newline_delimited
    decoding:
      codec: bytes
    maximum_buffer_size_bytes: 4194304

  node_exporter:
    type: exec
    mode: streaming
    command: ["node_exporter", "--no-collector.kernel_hung"]
    working_directory: /usr/local/bin
    streaming:
      respawn_on_exit: true
      respawn_interval_secs: 5
    framing:
      method: newline_delimited
    decoding:
      codec: bytes
    maximum_buffer_size_bytes: 4194304

  # Exposes component_discarded_events_total / component_errors_total so log
  # loss is visible in Victoria Metrics instead of silent.
  internal_metrics:
    type: internal_metrics

  express_metrics:
    type: prometheus_scrape
    endpoints:
      - http://127.0.0.1:7000/metrics
    scrape_interval_secs: 15

  caddy_metrics:
    type: prometheus_scrape
    endpoints:
      - https://127.0.0.1:9000/metrics
    scrape_interval_secs: 15

  node_metrics:
    type: prometheus_scrape
    endpoints:
      - http://127.0.0.1:9100/metrics
    scrape_interval_secs: 15

  java_metrics:
    type: prometheus_scrape
    endpoints:
      - http://127.0.0.1:5000/metrics
    scrape_interval_secs: 15

transforms:
  tag_facesign:
    type: remap
    inputs: [facesign]
    source: '.component = "express"'

  tag_uls:
    type: remap
    inputs: [uls]
    source: '.component = "uls"'

  tag_facetec:
    type: remap
    inputs: [facetec]
    source: '.component = "java"'

  tag_caddy:
    type: remap
    inputs: [caddy]
    source: '.component = "caddy"'

  tag_node_exporter:
    type: remap
    inputs: [node_exporter]
    source: '.component = "node"'

  logs:
    type: remap
    inputs:
      - tag_facesign
      - tag_uls
      - tag_facetec
      - tag_caddy
      - tag_node_exporter
    source: |
      # merge!() lets the parsed payload win, so stash the label first
      component = .component

      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge!(., object!(parsed))
        del(.message)
      } else if component == "java" {
        # FaceTec Server Webservice Debug:  Thu Jun 04 10:16:48 UTC 2026 - GET - /status - <uuid> - Request started.
        ft, ft_err = parse_regex(.message, r'^FaceTec Server Webservice (?P<level>[A-Za-z]+):\s+(?P<timestamp>[A-Za-z]{3} [A-Za-z]{3} \d{2} \d{2}:\d{2}:\d{2} [A-Z]+ \d{4}) - (?P<http_method>[A-Z]+) - (?P<http_path>[^ ]+) - (?P<request_id>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) - (?P<detail>.*)$')
        if ft_err == null {
          .log_kind = "facetec_webservice"
          .log_level = downcase(ft.level) ?? ft.level
          .http_method = ft.http_method
          .http_path = ft.http_path
          .request_id = ft.request_id
          .detail = ft.detail

          ts, ts_err = parse_timestamp(ft.timestamp, format: "%a %b %d %H:%M:%S %Z %Y", timezone: "UTC")
          if ts_err == null {
            .timestamp = ts
          } else {
            .timestamp_raw = ft.timestamp
          }

          tt, tt_err = parse_regex(ft.detail, r'^Total Time: (?P<total_time_ms>\d+)$')
          if tt_err == null {
            .total_time_ms = to_int(tt.total_time_ms) ?? tt.total_time_ms
            .detail = "request_completed"
          } else if ft.detail == "Request started." {
            .detail = "request_started"
          }

          del(.message)
        }
      }
      # anything unparsed keeps .message verbatim rather than being dropped

      .component = component
      .application = "facesign"
      .environment = get_env_var("OTEL_ENVIRONMENT") ?? "unknown"
      del(.command)

  express_metric_labels:
    type: remap
    inputs:
      - express_metrics
    source: |
      .tags.component = "express"

  caddy_metric_labels:
    type: remap
    inputs:
      - caddy_metrics
    source: |
      .tags.component = "caddy"

  node_metric_labels:
    type: remap
    inputs:
      - node_metrics
    source: |
      .tags.component = "node"

  java_metric_labels:
    type: remap
    inputs:
      - java_metrics
    source: |
      .tags.component = "java"

  internal_metric_labels:
    type: remap
    inputs:
      - internal_metrics
    source: |
      .tags.component = "vector"

  global_labels:
    type: remap
    inputs:
      - express_metric_labels
      - caddy_metric_labels
      - node_metric_labels
      - java_metric_labels
      - internal_metric_labels
    source: |
      .tags.application = "facesign"
      .tags.environment = get_env_var("OTEL_ENVIRONMENT") ?? "unknown"
      .tags.job = "facesign-vector-push"

  metrics_cardinality:
    type: tag_cardinality_limit
    inputs:
      - global_labels
    mode: exact

sinks:
  prometheus:
    # Read this why we are using tag_cardinality_limits
    # https://vector.dev/docs/reference/configuration/sinks/prometheus_remote_write/
    type: prometheus_remote_write
    inputs:
      - metrics_cardinality
    endpoint: "${OTEL_BASE_URL}/api/v1/write"
    healthcheck:
      # Our Victoria Metrics now did not expose health endpoint
      enabled: false
    auth:
      strategy: basic
      user: "${OTEL_USER}"
      password: "${OTEL_PASSWORD}"

  loki:
    type: loki
    inputs:
      - logs
    endpoint: "${OTEL_BASE_URL}"
    healthcheck:
      # Our loki now did not expose health endpoint
      enabled: false
    auth:
      strategy: basic
      user: "${OTEL_USER}"
      password: "${OTEL_PASSWORD}"
    # Default is `drop`, which silently discards any event whose timestamp is
    # behind the stream head. Requires Loki >= 2.4 (unordered writes).
    out_of_order_action: accept
    buffer:
      type: memory
      max_events: 10000
      when_full: block
    encoding:
      codec: json
    labels:
      application: "{{ application }}"
      component: "{{ component }}"
      environment: "{{ environment }}"

  console:
    type: console
    inputs:
      - logs
    target: stdout
    encoding:
      codec: json
