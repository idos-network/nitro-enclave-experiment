name: FaceSign Service

on:
  push:
    branches: [master, main]
    paths:
      - "facesign-service/**"
      - ".github/workflows/facesign-service.yml"
  pull_request:
    paths:
      - "facesign-service/**"
      - ".github/workflows/facesign-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: facesign-service/package.json
          cache_dependency_path: facesign-service/pnpm-lock.yaml
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: facesign-service/.node-version
          cache: pnpm
          cache-dependency-path: facesign-service/pnpm-lock.yaml

      - name: Install packages
        working-directory: facesign-service
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: facesign-service
        run: pnpm run types

      - name: Run lint
        working-directory: facesign-service
        run: pnpm run format:ci

      - name: Run tests
        working-directory: facesign-service
        run: pnpm run test:coverage

      - name: Report coverage
        # always() so the report is still posted when tests fail
        # (requires reportOnFailure: true in vitest.config.js)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          # unique name, otherwise this comment collides with the entropy one
          name: FaceSign Service
          working-directory: ./facesign-service

      - name: Run audit
        working-directory: facesign-service
        run: pnpm exec audit-ci --package-manager pnpm --high --critical
