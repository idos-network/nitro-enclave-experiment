name: Nitro SDK builder image

# Publishes the `builder` stage of aws-nitro-enclaves-sdk-c's official containers/Dockerfile.al2
# (kmstool_enclave_cli, libnsm.so, nsm.h and a C toolchain) to GHCR. enclave-service/Dockerfile
# starts its kmstool stage FROM this image. Run it when SDK_REF changes, then pin the digest
# from the job summary in the Dockerfile.

on:
  push:
    branches: [master, main]
    paths:
      - ".github/workflows/nitro-sdk-builder.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # aws-nitro-enclaves-sdk-c v0.4.5
  SDK_REF: cd61b6187c8b20867ba4368d1ae62c5790c0269a
  IMAGE: ghcr.io/${{ github.repository_owner }}/nitro-sdk-builder

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the official builder stage and push
        run: |
          docker buildx build --platform linux/amd64 --target builder \
            -f containers/Dockerfile.al2 \
            -t "$IMAGE:v0.4.5" -t "$IMAGE:$SDK_REF" --push \
            "https://github.com/aws/aws-nitro-enclaves-sdk-c.git#$SDK_REF"

      - name: Digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$SDK_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "Pin in enclave-service/Dockerfile: \`FROM $IMAGE:v0.4.5@$DIGEST AS kmstool\`" >> "$GITHUB_STEP_SUMMARY"
