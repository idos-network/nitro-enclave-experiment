name: Entropy service

on:
  push:
    branches: [master, main]
    paths:
      - "entropy-service/**"
      - ".github/workflows/entropy-service.yml"
  pull_request:
    paths:
      - "entropy-service/**"
      - ".github/workflows/entropy-service.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: entropy-service/package.json
          cache_dependency_path: entropy-service/pnpm-lock.yaml
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: entropy-service/.node-version
          cache: pnpm
          cache-dependency-path: entropy-service/pnpm-lock.yaml

      - name: Install packages
        working-directory: entropy-service
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: entropy-service
        run: pnpm run types

      - name: Run lint
        working-directory: entropy-service
        run: pnpm run format:ci

      - name: Run tests
        working-directory: entropy-service
        run: pnpm run test

      - name: Run audit
        working-directory: entropy-service
        run: pnpm exec audit-ci --package-manager pnpm --high --critical
