name: Services

on:
  push:
    branches: [master, main]
    paths:
      - "*-service/**"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "*-service/**"
      - ".github/workflows/services.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      # Required to checkout the code
      contents: read
      # Required to put a comment into the pull-request
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - dir: entropy-service
            name: Entropy Service
          - dir: facesign-service
            name: FaceSign Service
          - dir: enclave-service
            name: Enclave Service

    name: ${{ matrix.service.name }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ${{ matrix.service.dir }}/package.json
          cache_dependency_path: ${{ matrix.service.dir }}/pnpm-lock.yaml
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ matrix.service.dir }}/.node-version
          cache: pnpm
          cache-dependency-path: ${{ matrix.service.dir }}/pnpm-lock.yaml

      - name: Install packages
        working-directory: ${{ matrix.service.dir }}
        run: pnpm install --frozen-lockfile

      - name: Run type check
        working-directory: ${{ matrix.service.dir }}
        run: pnpm run types

      - name: Run lint
        working-directory: ${{ matrix.service.dir }}
        run: pnpm run format:ci

      - name: Run tests
        working-directory: ${{ matrix.service.dir }}
        run: pnpm run test:coverage

      - name: Report coverage
        # always() so the report is still posted when tests fail
        # (requires reportOnFailure: true in vitest.config.js)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ${{ matrix.service.name }}
          working-directory: ./${{ matrix.service.dir }}

      - name: Run audit
        working-directory: ${{ matrix.service.dir }}
        run: pnpm exec audit-ci --package-manager pnpm --high --critical
