name: Proxy EIF (staging)

on:
  push:
    branches: [deploy_to_staging]
    paths:
      - "proxy-service/**"
      - "shared/**"
      - "aws-nitro-kernel/blobs/**"
      - ".github/workflows/proxy-eif-staging.yml"
  workflow_dispatch:

concurrency:
  group: proxy-eif-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-eif:
    name: Build proxy-service EIF
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Dockerfile does COPY scripts/shared; sync_enclave.sh does the same on the host
      - name: Copy shared scripts into build context
        run: cp -a shared proxy-service/scripts/

      - name: Build EIF with custom kernel
        id: eif
        # ponytail: pin to a tag once the buildx branch is merged in the action repo
        uses: idos-network/nitro-enclaves-eif-build-action@4d3b1c49da8453b31386140ef480c66d9d6c7230 # buildx
        with:
          context: proxy-service/
          dockerfile: Dockerfile
          kernel-blobs: aws-nitro-kernel/blobs/
          eif-name: idos-proxy.eif
          build-args: |
            S3_SECRETS_BUCKET=${{ secrets.STAGING_S3_BUCKET }}
            S3_SECRETS_REGION=${{ vars.STAGING_S3_REGION || 'eu-west-1' }}

      - name: Upload EIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idos-proxy-eif-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ steps.eif.outputs.eif-path }}
            ${{ steps.eif.outputs.info-path }}

      - name: Proof
        env:
          SHA256: ${{ steps.eif.outputs.eif-sha256 }}
          PCR0: ${{ steps.eif.outputs.pcr0 }}
          PCR1: ${{ steps.eif.outputs.pcr1 }}
          PCR2: ${{ steps.eif.outputs.pcr2 }}
        run: |
          {
            echo "## idos-proxy.eif @ ${GITHUB_SHA}"
            echo '```'
            echo "sha256 = ${SHA256}"
            echo "PCR0   = ${PCR0}"
            echo "PCR1   = ${PCR1}"
            echo "PCR2   = ${PCR2}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
