data_dir: /mnt/encrypted/vector

sources:
  service_logs:
    type: file
    include:
      - /mnt/encrypted/logs/*/current
      # keep reading the tail of a file s6-log has just rotated away
      - /mnt/encrypted/logs/*/@*.s
    exclude:
      # vector's own logs, or it would re-ingest everything it prints
      - /mnt/encrypted/logs/vector/*
    read_from: beginning
    # s6-log rotates by rename, so follow the inode, not the first line
    fingerprint:
      strategy: device_and_inode
  # Exposes component_discarded_events_total / component_errors_total so log
  # loss is visible in Victoria Metrics instead of silent.
  internal_metrics:
    type: internal_metrics

  express_metrics:
    type: prometheus_scrape
    endpoints:
      - http://127.0.0.1:7000/metrics
    scrape_interval_secs: 15

  caddy_metrics:
    type: prometheus_scrape
    endpoints:
      - https://127.0.0.1:9000/metrics
    scrape_interval_secs: 15

  node_metrics:
    type: prometheus_scrape
    endpoints:
      - http://127.0.0.1:9100/metrics
    scrape_interval_secs: 15

transforms:
  logs:
    type: remap
    inputs:
      - service_logs
    source: |
      # /mnt/encrypted/logs/<component>/current -> the s6 service name is the label
      component = "unknown"
      dir, dir_err = parse_regex(string!(.file), r'/logs/(?P<component>[^/]+)/')
      if dir_err == null {
        component = dir.component
      }
      del(.file)
      del(.host)

      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed))
        del(.message)
      }
      # non-JSON lines keep .message verbatim rather than being dropped

      .component = component
      .application = "enclave"
      .environment = get_env_var("OTEL_ENVIRONMENT") ?? "unknown"

  express_metric_labels:
    type: remap
    inputs:
      - express_metrics
    source: |
      .tags.component = "express"

  caddy_metric_labels:
    type: remap
    inputs:
      - caddy_metrics
    source: |
      .tags.component = "caddy"

  node_metric_labels:
    type: remap
    inputs:
      - node_metrics
    source: |
      .tags.component = "node"

  internal_metric_labels:
    type: remap
    inputs:
      - internal_metrics
    source: |
      .tags.component = "vector"

  global_labels:
    type: remap
    inputs:
      - express_metric_labels
      - caddy_metric_labels
      - node_metric_labels
      - internal_metric_labels
    source: |
      .tags.application = "enclave"
      .tags.environment = get_env_var("OTEL_ENVIRONMENT") ?? "unknown"
      .tags.job = "enclave-vector-push"

  metrics_cardinality:
    type: tag_cardinality_limit
    inputs:
      - global_labels
    mode: exact

sinks:
  prometheus:
    # Read this why we are using tag_cardinality_limits
    # https://vector.dev/docs/reference/configuration/sinks/prometheus_remote_write/
    type: prometheus_remote_write
    inputs:
      - metrics_cardinality
    endpoint: "${OTEL_BASE_URL}/api/v1/write"
    healthcheck:
      # Our Victoria Metrics now did not expose health endpoint
      enabled: false
    auth:
      strategy: basic
      user: "${OTEL_USER}"
      password: "${OTEL_PASSWORD}"

  loki:
    type: loki
    inputs:
      - logs
    endpoint: "${OTEL_BASE_URL}"
    healthcheck:
      # Our loki now did not expose health endpoint
      enabled: false
    auth:
      strategy: basic
      user: "${OTEL_USER}"
      password: "${OTEL_PASSWORD}"
    # Default is `drop`, which silently discards any event whose timestamp is
    # behind the stream head. Requires Loki >= 2.4 (unordered writes).
    out_of_order_action: accept
    buffer:
      type: memory
      max_events: 10000
      when_full: block
    encoding:
      codec: json
    labels:
      application: "{{ application }}"
      component: "{{ component }}"
      environment: "{{ environment }}"

