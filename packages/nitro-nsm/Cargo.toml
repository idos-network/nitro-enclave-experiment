[package]
name = "nitro-nsm"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aws-nitro-enclaves-nsm-api = "0.4.0"
napi = { version = "2.16.17", default-features = false, features = ["napi4"] }
napi-derive = "2.16.13"
serde_bytes = "0.11.17"

[profile.release]
lto = true
