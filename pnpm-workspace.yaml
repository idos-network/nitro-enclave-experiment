packages:
  - packages/*
  - "*-service"

allowBuilds:
  # install-time telemetry, not needed in a TEE image
  '@scarf/scarf': false
  # profiler addon for @pyroscope/nodejs: ships prebuilds, its install script is `exit 0`
  '@datadog/pprof': false
  mongodb-client-encryption: true
  msw: true

overrides:
  body-parser: ">= 2.4.0"
  vite: ">= 8.2.4"
  form-data: ">= 4.0.6"
  postcss: ">=8.5.18"
  ip-address: ">= 10.3.1"
  nanoid: ">= 3.3.17"
  source-map-js: ">= 1.2.2"
  proxy-addr: ">= 2.0.8"

peerDependencyRules:
  allowedVersions:
    # prom-client is aliased to its successor @prometheus-io/client (package.json)
    express-prom-bundle>prom-client: "0.16"
