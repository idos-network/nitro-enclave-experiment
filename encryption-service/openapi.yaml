openapi: 3.1.0
info:
  title: Encryption Service
  description: |
    Session-based encryption service. Clients create a session with their
    public key, then use a wrapped encryption key to encrypt/decrypt data or
    fetch the unwrapped user public key.
  version: 1.0.0

servers:
  - url: https://encryption.staging.sandbox.fractal.id/
    description: Staging environment
  - url: https://encryption.idos.network/
    description: Production
  - url: http://localhost:7000
    description: Local development

tags:
  - name: Health
  - name: Keys
  - name: Session

paths:
  /:
    get:
      tags: [Health]
      summary: Service info
      operationId: getRoot
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Encryption Service is running

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /.well-known/jwks.json:
    get:
      tags: [Keys]
      summary: JWKS for session signature verification
      description: |
        Returns the KMS signing public key as a JWK set. Used to verify
        `encryptionPublicKeySignature` on session creation responses (EdDSA / Ed25519).
      operationId: getJwks
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

  /session:
    post:
      tags: [Session]
      summary: Create a session
      description: |
        Creates a new encryption session bound to the caller's `publicKey`.
        Returns the session encryption public key (X25519 JWK) and a flattened
        JWS signature over that key (RFC 7797, `b64: false`).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /session/public-key:
    post:
      tags: [Session]
      summary: Get unwrapped user public key
      description: |
        Unwraps `wrappedEncryptionKey` using the session ephemeral key and the
        client public key stored at session creation, then returns the derived
        Curve25519 public key (base64).
      operationId: getSessionPublicKey
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Unwrapped user public key
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /session/encrypt:
    post:
      tags: [Session]
      summary: Encrypt data for a recipient
      description: |
        Encrypts `data` (base64 plaintext bytes) to `publicKey` (recipient
        Curve25519 public key, base64) using the unwrapped encryption secret key.
        Returns NaCl box ciphertext as base64 (`nonce || ciphertext`).
      operationId: encrypt
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Encrypted payload
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /session/decrypt:
    post:
      tags: [Session]
      summary: Decrypt data from a sender
      description: |
        Decrypts `data` (base64 `nonce || ciphertext`) using `publicKey`
        (sender Curve25519 public key, base64) and the unwrapped encryption secret key.
        Returns plaintext bytes as base64.
      operationId: decrypt
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRequest"
      responses:
        "200":
          description: Decrypted payload
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

components:
  parameters:
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Optional request correlation id; echoed on the response.
      schema:
        type: string
        format: uuid

  headers:
    XRequestId:
      description: Request correlation id (from request or generated).
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Request body failed Zod validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    SessionNotFound:
      description: Session key pair unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CreateSessionRequest:
      type: object
      required: [publicKey]
      description: Body for `POST /session` (`CreateSessionRequestSchema`)
      properties:
        publicKey:
          type: string
          description: |
            Base64-encoded client Curve25519 public key. Stored with the session
            and used later to unwrap `wrappedEncryptionKey`.

    WrappedEncryptionKey:
      type: object
      required: [sessionId, encryptedKey, nonce]
      properties:
        sessionId:
          type: string
          format: uuid
          description: Session UUID from `POST /session`
        encryptedKey:
          type: string
          description: |
            Base64-encoded NaCl box of the user encryption secret key, sealed to
            the session encryption public key with the client session secret key
        nonce:
          type: string
          description: Base64-encoded nonce used to wrap the key

    SessionRequest:
      type: object
      required: [wrappedEncryptionKey, data, publicKey]
      description: Body for session-authenticated endpoints (`RequestSchema`)
      properties:
        wrappedEncryptionKey:
          $ref: "#/components/schemas/WrappedEncryptionKey"
        data:
          type: string
          description: |
            Base64-encoded payload. For encrypt: plaintext bytes.
            For decrypt: `nonce || ciphertext`. May be unused for public-key.
        publicKey:
          type: string
          description: |
            Base64 Curve25519 public key. For encrypt: recipient (decryptor).
            For decrypt: sender (encryptor).

    EncryptionPublicKey:
      type: object
      description: X25519 public key as a JWK
      required: [kty, crv, x]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: X25519
        x:
          type: string
          description: Base64url-encoded X25519 public key

    EncryptionPublicKeySignature:
      type: object
      description: |
        Flattened JWS (RFC 7515 §7.2.2) with unencoded payload (RFC 7797,
        `b64: false`). Signing input is `protected + "." + JSON.stringify(payload)`.
      required: [protected, payload, signature]
      properties:
        protected:
          type: string
          description: |
            Base64url-encoded JWS protected header
            (`{ kid, alg: "EdDSA", b64: false, crit: ["b64"] }`)
        payload:
          type: object
          required: [publicKeyX, nonce]
          properties:
            publicKeyX:
              type: string
              description: Same value as `encryptionPublicKey.x`
            nonce:
              type: string
              format: uuid
              description: Random nonce to prevent deterministic sign fingerprinting
        signature:
          type: string
          description: Base64url-encoded Ed25519 signature

    CreateSessionResponse:
      type: object
      required: [sessionId, encryptionPublicKey, encryptionPublicKeySignature]
      properties:
        sessionId:
          type: string
          format: uuid
        encryptionPublicKey:
          $ref: "#/components/schemas/EncryptionPublicKey"
        encryptionPublicKeySignature:
          $ref: "#/components/schemas/EncryptionPublicKeySignature"

    PublicKeyResponse:
      type: object
      required: [sessionId, publicKey]
      properties:
        sessionId:
          type: string
          format: uuid
        publicKey:
          type: string
          description: Base64 Curve25519 public key derived from the unwrapped encryption secret

    DataResponse:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: Base64-encoded result (ciphertext or plaintext bytes)

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Session not found

    ValidationError:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
          example: Invalid request body
        details:
          description: Zod validation error object
          type: object
          additionalProperties: true

    Jwk:
      type: object
      description: JSON Web Key (EdDSA signing key from KMS)
      required: [kid, use, alg]
      properties:
        kty:
          type: string
          example: OKP
        crv:
          type: string
          example: Ed25519
        x:
          type: string
          description: Base64url-encoded public key
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          const: EdDSA
      additionalProperties: true

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
          minItems: 1
          maxItems: 1
