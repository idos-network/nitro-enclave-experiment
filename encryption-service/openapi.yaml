openapi: 3.1.0
info:
  title: Encryption Service
  description: |
    Session-based encryption service. Clients create a session with their
    client public key and allowed audience roots, then authenticate later
    requests with a wrapped content encryption key to encrypt/decrypt data or
    fetch the unwrapped user public key.
  version: 1.0.0

servers:
  - url: https://encryption.staging.sandbox.fractal.id/
    description: Staging environment
  - url: https://encryption.idos.network/
    description: Production
  - url: http://localhost:7000
    description: Local development

tags:
  - name: Health
  - name: Keys
  - name: Session

paths:
  /:
    get:
      tags: [Health]
      summary: Service info
      operationId: getRoot
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: Encryption Service is running

  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok

  /.well-known/jwks.json:
    get:
      tags: [Keys]
      summary: JWKS for session signature verification
      description: |
        Returns the KMS signing public key as a JWK set. Used to verify
        `jwtChain` on session creation responses (EdDSA / Ed25519).
      operationId: getJwks
      responses:
        "200":
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"

  /session:
    post:
      tags: [Session]
      summary: Create a session
      description: |
        Creates a new encryption session bound to `sessionClientPublicKey` and
        `allowedAudienceRoots`. Returns the session server public key
        (X25519 JWK) and a compact JWS chain over that key (RFC 7515).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /session/public-key:
    post:
      tags: [Session]
      summary: Get unwrapped user public key
      description: |
        Unwraps `session.encryptedKey` using the session server key and the
        client public key stored at session creation, then returns the derived
        Curve25519 public key (base64).
        Uses `CommonRequestSchema` (`session` + `audience` only).
      operationId: getSessionPublicKey
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommonRequest"
      responses:
        "200":
          description: Audience-encrypted response containing `PublicKeyResponse`
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /session/encrypt:
    post:
      tags: [Session]
      summary: Encrypt data for a recipient
      description: |
        Encrypts `arguments.payload` (base64 plaintext bytes) to
        `arguments.publicKey` (recipient Curve25519 public key, base64) using
        the unwrapped content encryption secret key.
        The successful response is encrypted for the verified audience. After
        decrypting the response envelope, the inner body contains `DataResponse`.
        Uses `DataRequestSchema` (`session` + `audience` + `arguments`).
      operationId: encrypt
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
      responses:
        "200":
          description: Audience-encrypted response containing `DataResponse`
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

  /session/decrypt:
    post:
      tags: [Session]
      summary: Decrypt data from a sender
      description: |
        Decrypts using `arguments.publicKey` (sender Curve25519 public key,
        base64) and the unwrapped content encryption secret key.
        If `arguments.nonce` is set, `arguments.payload` is ciphertext only;
        otherwise `arguments.payload` is base64 `nonce || ciphertext`.
        The successful response is encrypted for the verified audience. After
        decrypting the response envelope, the inner body contains `DataResponse`
        with plaintext bytes as base64.
        Uses `DataRequestSchema` (`session` + `audience` + `arguments`).
      operationId: decrypt
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataRequest"
      responses:
        "200":
          description: Audience-encrypted response containing `DataResponse`
          headers:
            x-request-id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/SessionNotFound"

components:
  parameters:
    XRequestId:
      name: x-request-id
      in: header
      required: false
      description: Optional request correlation id; echoed on the response.
      schema:
        type: string

  headers:
    XRequestId:
      description: Request correlation id (from request or generated).
      schema:
        type: string

  responses:
    BadRequest:
      description: Request body failed validation or audience verification failed
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ValidationError"
              - $ref: "#/components/schemas/Error"
    SessionNotFound:
      description: Session key pair unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    CreateSessionRequest:
      type: object
      required: [sessionClientPublicKey, allowedAudienceRoots]
      description: Body for `POST /session` (`CreateSessionRequestSchema`)
      properties:
        sessionClientPublicKey:
          type: string
          description: |
            Base64-encoded client Curve25519 public key. Stored with the session
            and used later to unwrap `session.encryptedKey`.
        allowedAudienceRoots:
          type: array
          items:
            type: string
          description: Audience roots permitted for this session

    SessionContext:
      type: object
      required: [id, encryptedKey, nonce]
      properties:
        id:
          type: string
          format: uuid
          description: Session UUID from `POST /session`
        nonce:
          type: string
          description: Base64-encoded nonce used to wrap the content encryption key
        encryptedKey:
          type: string
          description: |
            Base64-encoded NaCl box of the content encryption secret key, sealed
            to the session server public key with the client session secret key

    SessionArguments:
      type: object
      required: [payload, publicKey]
      properties:
        payload:
          type: string
          description: |
            Base64-encoded payload. For encrypt: plaintext bytes.
            For decrypt: ciphertext only when `nonce` is set, otherwise
            `nonce || ciphertext`.
        nonce:
          type: string
          description: |
            Optional base64-encoded nonce for decrypt. When omitted, the nonce
            is taken from the first 24 bytes of `payload`.
        publicKey:
          type: string
          description: |
            Base64 Curve25519 public key. For encrypt: recipient (decryptor).
            For decrypt: sender (encryptor).

    Audience:
      type: object
      required: [recipientPublicKey, jwtChain]
      properties:
        recipientPublicKey:
          $ref: "#/components/schemas/AudienceRecipientPublicKey"
        jwtChain:
          type: string
          description: |
            Compact JWT signed with EdDSA by one of the allowed audience root
            JWKS keys.
            The decoded payload contains `{ recipientPublicKeyX }`, where
            `recipientPublicKeyX` is the base64url audience public key.

    CommonRequest:
      type: object
      required: [session, audience]
      description: Body for `POST /session/public-key` (`CommonRequestSchema`)
      properties:
        session:
          $ref: "#/components/schemas/SessionContext"
        audience:
          $ref: "#/components/schemas/Audience"

    DataRequest:
      allOf:
        - $ref: "#/components/schemas/CommonRequest"
        - type: object
          required: [arguments]
          description: Body for encrypt/decrypt (`DataRequestSchema`)
          properties:
            arguments:
              $ref: "#/components/schemas/SessionArguments"

    SessionServerPublicKey:
      type: object
      description: X25519 session server public key as a JWK
      required: [kty, crv, x]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: X25519
        x:
          type: string
          description: Base64url-encoded X25519 public key

    X25519EncryptionPublicKey:
      type: object
      description: X25519 public key as a JWK for NaCl box encryption
      required: [kty, crv, x, use]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: X25519
        use:
          type: string
          const: enc
        x:
          type: string
          description: Base64url-encoded X25519 public key
        kid:
          type: string
          description: Optional key id

    AudienceRecipientPublicKey:
      allOf:
        - $ref: "#/components/schemas/X25519EncryptionPublicKey"
        - type: object
          required: [kid]

    CreateSessionResponse:
      type: object
      required: [id, jwtChain, sessionServerPublicKey]
      properties:
        id:
          type: string
          format: uuid
        jwtChain:
          type: string
          description: |
            Compact JWS (`protected.payload.signature`) signed with KMS EdDSA.
            The decoded payload contains
            `{ sessionServerPublicKeyX: sessionServerPublicKey.x, nonce }`.
        sessionServerPublicKey:
          $ref: "#/components/schemas/SessionServerPublicKey"

    PublicKeyResponse:
      type: object
      required: [sessionId, publicKey]
      properties:
        sessionId:
          type: string
          format: uuid
        publicKey:
          type: string
          description: Base64 Curve25519 public key derived from the unwrapped content encryption secret

    DataResponse:
      type: object
      required: [data]
      properties:
        data:
          type: string
          description: Base64-encoded result (ciphertext or plaintext bytes)

    EncryptedResponse:
      type: object
      description: |
        Response body encrypted for the verified audience with NaCl box.
        Decrypt `payload` using `nonce`, `audience.senderPublicKey`, and the
        private key matching `audience.recipientPublicKey`.
      required: [audience, nonce, payload]
      properties:
        audience:
          type: object
          required: [recipientPublicKey, senderPublicKey]
          properties:
            recipientPublicKey:
              $ref: "#/components/schemas/X25519EncryptionPublicKey"
            senderPublicKey:
              $ref: "#/components/schemas/X25519EncryptionPublicKey"
        nonce:
          type: string
          description: Base64-encoded NaCl box nonce
        payload:
          type: string
          description: Base64-encoded encrypted JSON response body

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Session not found

    ValidationError:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
          example: Invalid request body
        details:
          description: Zod validation error object
          type: object
          additionalProperties: true

    Jwk:
      type: object
      description: JSON Web Key (Ed25519 signing key from KMS)
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty:
          type: string
          const: OKP
        crv:
          type: string
          const: Ed25519
        x:
          type: string
          description: Base64url-encoded Ed25519 public key
        kid:
          type: string
        use:
          type: string
          const: sig
        alg:
          type: string
          const: EdDSA
      additionalProperties: true

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/Jwk"
          minItems: 1
          maxItems: 1
